name: Events Demo 1
on:
  pull_request:
    types: [opened, edited]
  workflow_dispatch:
  push:
    branches: # branches filter can also exist under pull_request
      - master
      - 'dev-*' # any branches starting in dev- will trigger. example dev-new, dev-this-is-new
      - 'feat/**' # any branches inside the feat/ folder will trigger. Double asterisk allows for more slashes where single asterisk is any characters other than slashes. example feat/new, feat/new/button
    paths-ignore:
      - '.github/workflows/*' # Makes the push not trigger if a file in this path was pushed
#    paths:
#      - '.github/workflows/*' # Makes the push only trigger if a file in this path was pushed
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."